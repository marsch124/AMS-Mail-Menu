name: AMSMailMenu
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  MailMenuCore:
    path: Core
targets:
  AMSMailMenu:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: AMS Mail Menu
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: AMS Mail Menu reads your newest emails from Apple Mail and can mark them as read, archive, delete or reply. Nothing leaves your Mac.
    settings:
      base:
        PRODUCT_NAME: AMS Mail Menu
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSMailMenu
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: D24ENP83QQ
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: MailMenuCore
schemes:
  AMS Mail Menu:
    build:
      targets:
        AMSMailMenu: all
    run:
      config: Release
