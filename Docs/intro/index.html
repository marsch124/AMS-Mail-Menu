<meta charset="utf-8">
<title>Mail Menu Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: chapter rail on the left, coach + a pretend Mac on the right. Reusable tour engine: LESSONS + a small simulator.
   Based on the AMS Fan Menu tour engine. Written for AMS Mail Menu 0.9.6. Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F3F6FA; --panel: #FFFFFF; --fg: #17212B; --muted: #5F6C7A; --line: #DCE3EB;
  --accent: #1F69C2; --accent-soft: #E1ECF9; --good: #2F7D32; --good-soft: #E6F3E6; --warn: #A8431A;
  --desk-a: #C9D6E2; --desk-b: #E4DCEB; --menubar: rgba(255,255,255,.8); --menubar-fg: #1B1B1D;
  --win: #FFFFFF; --win-bar: #F1F1F3; --win-fg: #1B1B1D; --win-muted: #6F6F74; --card: rgba(0,0,0,.05); --shadow: 0 18px 40px rgba(23,33,43,.2);
  --c-mac: #1C7347; --c-macf: #217E4F; --c-fan: #1F69C2; --c-fanf: #2673C7; --c-heat: #B8421C; --c-heatf: #C44D24;
  --c-warn: #8F5900; --c-danger: #C71A24; --c-power: #07707A; --c-story: #6B4DBC; --c-storyf: #6B4DBC;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", sans-serif;
  --f-mac: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#12171D; --panel:#1B232C; --fg:#EDF2F7; --muted:#9FADBB; --line:#2E3946;
  --accent:#80BAFA; --accent-soft:#1B2D44; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --desk-a:#1C2733; --desk-b:#2E2A3A; --menubar: rgba(28,28,32,.8); --menubar-fg:#F2F2F4;
  --win:#27272B; --win-bar:#323237; --win-fg:#F2F2F4; --win-muted:#A5A5AD; --card: rgba(255,255,255,.07); --shadow: 0 18px 40px rgba(0,0,0,.55);
  --c-mac:#66C78F; --c-macf:#298554; --c-fan:#80BAFA; --c-fanf:#2B75CC; --c-heat:#F79470; --c-heatf:#C44D24;
  --c-warn:#F5C25C; --c-danger:#FF6B6B; --c-power:#5CCCCC; --c-story:#B8A3F5; --c-storyf:#755CC7;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#12171D; --panel:#1B232C; --fg:#EDF2F7; --muted:#9FADBB; --line:#2E3946;
  --accent:#80BAFA; --accent-soft:#1B2D44; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --desk-a:#1C2733; --desk-b:#2E2A3A; --menubar: rgba(28,28,32,.8); --menubar-fg:#F2F2F4;
  --win:#27272B; --win-bar:#323237; --win-fg:#F2F2F4; --win-muted:#A5A5AD; --card: rgba(255,255,255,.07); --shadow: 0 18px 40px rgba(0,0,0,.55);
  --c-mac:#66C78F; --c-macf:#298554; --c-fan:#80BAFA; --c-fanf:#2B75CC; --c-heat:#F79470; --c-heatf:#C44D24;
  --c-warn:#F5C25C; --c-danger:#FF6B6B; --c-power:#5CCCCC; --c-story:#B8A3F5; --c-storyf:#755CC7;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 66ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #2673C7; border-color: #2673C7; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend Mac */
.stagebox { position: relative; width: 100%; aspect-ratio: 960 / 560; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); max-width: 100% }
.stage { position: absolute; left: 0; top: 0; width: 960px; height: 560px; transform-origin: 0 0; font-family: var(--f-mac); font-size: 12.5px; color: var(--win-fg);
  background: radial-gradient(120% 90% at 15% 10%, var(--desk-b), transparent 60%), linear-gradient(160deg, var(--desk-a), var(--desk-b)); }
.stage button { font-family: inherit }
/* Mail Menu colours, from Colours.swift (day / night). Every pretend-screen class starts with mm- so it can never clash with the engine's own classes. */
:root {
  --c-blue: #0A5CC4; --c-btn: #0A5CC4; --c-violet: #7D4DD1; --c-green: #218C4D; --c-orange: #FF9500; --c-red: #E5322A;
  --flap: #F3F3F5; --mm-win: #ECECEE; --mm-card: #FFFFFF; --mm-input: #FFFFFF; --undo-link: #8FC2FF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --c-blue: #6BADFF; --c-btn: #1A70E0; --c-violet: #B38FFF; --c-green: #5CCC80; --c-orange: #FF9F0A; --c-red: #FF6259;
  --flap: #1C1C20; --mm-win: #2C2C2F; --mm-card: #1F1F22; --mm-input: #1F1F22 } }
:root[data-theme="dark"] {
  --c-blue: #6BADFF; --c-btn: #1A70E0; --c-violet: #B38FFF; --c-green: #5CCC80; --c-orange: #FF9F0A; --c-red: #FF6259;
  --flap: #1C1C20; --mm-win: #2C2C2F; --mm-card: #1F1F22; --mm-input: #1F1F22 }

.mm-sp { flex: 1 }
.mm-mbar { position: absolute; inset: 0 0 auto; height: 26px; background: var(--menubar); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 16px; padding: 0 12px; color: var(--menubar-fg); font-size: 13px; z-index: 30 }
.mm-mbar b { font-weight: 700 }
.mm-item { position: relative; height: 22px; display: flex; align-items: center; gap: 3px; padding: 0 5px; border: 0; background: none; color: inherit; font: inherit; border-radius: 5px; cursor: pointer }
.mm-item:hover, .mm-item.open { background: rgba(127,127,127,.24) }
.mm-item svg { display: block; flex: none }
.mm-num { font-size: 13px }
.mm-t2 { display: flex; flex-direction: column; font: 300 8.5px/9px ui-monospace, "SF Mono", Menlo, monospace; text-align: left; font-variant-numeric: tabular-nums }
.mm-t2 i { font-style: normal; display: block }
.mm-tip { display: none; position: absolute; right: 0; top: 26px; width: max-content; max-width: 250px; background: var(--win); color: var(--win-fg); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 4px 8px; font-size: 12px; line-height: 1.35; text-align: left; z-index: 40; pointer-events: none; font-weight: 400 }
.mm-item:hover .mm-tip { display: block }
.mm-item.open .mm-tip { display: none }
.mm-tile { display: inline-grid; place-items: center; flex: none; background: #0A5CC4; color: #fff }
.mm-glyph { display: block; flex: none }
.mm-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }

/* The list */
.mm-panel { position: absolute; right: 8px; top: 30px; width: 292px; background: var(--mm-win); border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow); padding: 6px; z-index: 25; display: flex; flex-direction: column; font-size: 12px; max-height: 520px; overflow: hidden }
.mm-hd { display: flex; align-items: center; gap: 7px; padding: 0 4px 5px; white-space: nowrap }
.mm-hd b { font-size: 14px; font-weight: 700 }
.mm-key { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--win-muted) }
.mm-cnt { font-size: 10px; color: var(--win-muted) }
.mm-tri { font: inherit; font-size: 12px; border: 0; border-radius: 99px; padding: 1px 8px; background: var(--c-btn); color: #fff; cursor: pointer }
.mm-cards { display: flex; flex-direction: column; gap: 4px; padding: 0 4px; overflow: hidden }
.mm-card { background: var(--mm-card); border-radius: 5px; border: 1px solid rgba(127,127,127,.2); flex: none }
.mm-sh { display: flex; align-items: center; gap: 8px; padding: 2px 4px }
.mm-sname { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; color: inherit; font: inherit; font-size: 13px; text-align: left; padding: 0; cursor: pointer }
.mm-sname svg { width: 11px; height: 11px; flex: none; color: var(--win-muted); fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round }
.mm-sname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.mm-mr { border: 0; background: none; color: var(--c-blue); font: inherit; font-size: 12px; cursor: pointer; padding: 0 }
.mm-new { font-size: 11px; padding: 0 3px; border-radius: 4px; background: color-mix(in srgb, var(--c-blue) 15%, transparent); color: var(--c-blue) }
.mm-readn { font-size: 10px; color: var(--win-muted) }
.mm-row { border-top: 1px solid var(--line); padding: 2px 4px; cursor: pointer }
.mm-row:hover, .mm-row.force { background: color-mix(in srgb, var(--c-blue) 10%, transparent) }
.mm-l1 { display: flex; align-items: center; gap: 7px; min-height: 24px }
.mm-subj { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px }
.mm-subj.rd { color: var(--win-muted) }
.mm-tm { font-size: 11px; color: var(--win-muted); white-space: nowrap }
.mm-acts { display: none; gap: 4px }
.mm-row:hover .mm-acts, .mm-row.force .mm-acts { display: flex }
.mm-row:hover .mm-tm, .mm-row.force .mm-tm { display: none }
.mm-ab { width: 22px; height: 22px; border-radius: 6px; border: 1px solid rgba(127,127,127,.35); background: var(--mm-card); color: var(--c-blue); display: grid; place-items: center; padding: 0; cursor: pointer }
.mm-ab.red { color: var(--c-red) }
.mm-ab svg, .mm-ib svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round }
.mm-prev { font-size: 11px; color: var(--win-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 1px }
.mm-prob { padding: 2px 4px 4px; display: flex; flex-direction: column; gap: 3px; line-height: 1.3 }
.mm-prob .t { font-size: 13px }
.mm-r2 { display: flex; gap: 6px; align-items: center; color: var(--win-muted) }
.mm-sbtn { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 6px; border: 1px solid rgba(127,127,127,.4); background: var(--mm-card); color: var(--win-fg); cursor: pointer }
.mm-sbtn:disabled { opacity: .45; cursor: default }
.mm-pbtn { font: inherit; font-size: 12px; padding: 2px 12px; border-radius: 6px; border: 1px solid var(--c-btn); background: var(--c-btn); color: #fff; cursor: pointer }
.mm-pbtn:disabled { opacity: .45; cursor: default }
.mm-lbtn { border: 0; background: none; color: var(--c-blue); font: inherit; padding: 0; cursor: pointer; text-align: left }
.mm-undo { display: flex; justify-content: space-between; gap: 10px; background: #1C1C1E; color: #fff; border-radius: 5px; padding: 3px 6px; margin: 4px 4px 0; font-size: 12px }
.mm-undo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.mm-undo button { color: var(--undo-link); border: 0; background: none; cursor: pointer; font: inherit }
.mm-err { display: flex; align-items: flex-start; gap: 6px; padding: 4px 4px 0; font-size: 11.5px; line-height: 1.3 }
.mm-err svg { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--c-orange); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.mm-err button { border: 0; background: none; color: var(--win-muted); cursor: pointer; padding: 0; flex: none }
.mm-foot { display: flex; align-items: center; gap: 12px; padding: 3px 4px 0; margin-top: 4px; border-top: 1px solid var(--line); font-size: 10px; color: var(--win-muted) }
.mm-ib { border: 0; background: none; color: var(--c-blue); padding: 1px; cursor: pointer; display: grid }
.mm-ib svg { width: 15px; height: 15px }
.mm-empty { padding: 2px 8px; color: var(--win-muted) }

/* Menus: the two-finger menu and the email line menu */
.mm-ctx { position: absolute; width: 214px; background: var(--win); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; z-index: 36 }
.mm-ctx button { display: flex; width: 100%; align-items: center; gap: 6px; border: 0; background: none; color: var(--win-fg); font: inherit; padding: 3px 8px; border-radius: 5px; text-align: left; cursor: pointer }
.mm-ctx button:hover { background: #2673C7; color: #fff }
.mm-ctx hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px }
.mm-icm { right: 100px; top: 28px }
.mm-rcm { right: 306px; top: 96px; width: 238px }

/* Practice box */
.mm-practice { position: absolute; left: 12px; bottom: 12px; width: 262px; background: var(--win); border: 1px dashed var(--win-muted); border-radius: 11px; padding: 8px; z-index: 12; display: flex; flex-direction: column; gap: 4px }
.mm-practice small { color: var(--win-muted); font-size: 11px; line-height: 1.3; margin-bottom: 2px }
.mm-practice button { font: inherit; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--win-bar); color: var(--win-fg); cursor: pointer; text-align: left }

/* Windows: Email, Triage, Settings */
.mm-win { position: absolute; background: var(--mm-win); border-radius: 11px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; z-index: 20; display: flex; flex-direction: column; color: var(--win-fg); font-size: 12px }
.mm-tb { height: 28px; flex: none; background: var(--win-bar); display: flex; align-items: center; gap: 7px; padding: 0 11px; font-weight: 600 }
.mm-dots { display: flex; gap: 6px; margin-right: 8px }
.mm-dots i { width: 11px; height: 11px; border-radius: 50%; background: #E0605A; display: block; cursor: pointer }
.mm-dots i:nth-child(2), .mm-dots i:nth-child(3) { background: rgba(127,127,127,.35); cursor: default }
.mm-ttl { flex: 1; text-align: center; margin-right: 50px; color: var(--win-muted) }
.mm-set { left: 220px; top: 34px; width: 500px; height: 470px }
.mm-ewin { left: 468px; top: 36px; width: 460px; height: 410px }
.mm-twin { left: 110px; top: 30px; width: 740px; height: 500px }
.mm-inner { padding: 8px 10px 8px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0 }
.mm-pane { position: relative; flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; line-height: 1.35 }
.mm-pane p { margin: 0 }
.mm-seg { display: flex; background: rgba(127,127,127,.2); border-radius: 7px; padding: 2px; gap: 1px; flex: none }
.mm-seg button { flex: 1; border: 0; background: none; font: inherit; font-size: 12px; height: 22px; border-radius: 5px; color: inherit; cursor: pointer; white-space: nowrap }
.mm-seg button.on { background: var(--c-btn); color: #fff }
.mm-h { color: var(--c-blue); margin: 0; font-size: 12px }
.mm-note { font-size: 10.5px; color: var(--win-muted); line-height: 1.3 }
.mm-hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0; width: 100% }
.mm-r { display: flex; align-items: center; gap: 7px }
.mm-cb { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(127,127,127,.6); background: var(--mm-card); padding: 0; flex: none; cursor: pointer; display: grid; place-items: center; color: #fff }
.mm-cb.on { background: var(--c-btn); border-color: var(--c-btn) }
.mm-ehead svg, .mm-cb svg { fill: none } .mm-cb svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; display: none }
.mm-cb.on svg { display: block }
.mm-rad { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(127,127,127,.6); background: var(--mm-card); padding: 0; flex: none; cursor: pointer; display: grid; place-items: center }
.mm-rad.on { border: 4.5px solid var(--c-btn) }
.mm-sel { font: inherit; font-size: 12px; border: 1px solid rgba(127,127,127,.4); border-radius: 6px; background: var(--mm-card); color: var(--win-fg); height: 22px; padding: 0 4px }
.mm-stp { display: flex; align-items: center; gap: 3px }
.mm-stp button { width: 20px; height: 20px; border: 1px solid rgba(127,127,127,.4); border-radius: 5px; background: var(--mm-card); color: var(--win-fg); cursor: pointer; padding: 0 }
.mm-in { font: inherit; font-size: 12px; border: 1px solid rgba(127,127,127,.45); border-radius: 5px; background: var(--mm-input); color: var(--win-fg); height: 22px; padding: 0 6px; width: 100%; min-width: 0 }
.mm-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center }
.mm-sfoot { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--win-muted); flex: none; padding-top: 2px }
.mm-gh { padding-bottom: 2px }
.mm-gh b { color: var(--c-blue); font-weight: 400; font-size: 13px; display: block }
.mm-rel b { color: var(--c-blue); font-weight: 400; font-size: 13px }
.mm-rel li { margin: 0 0 3px; list-style: none; padding-left: 0 }
.mm-sign { display: flex; align-items: flex-start; gap: 8px; padding: 2px 0; border-top: 1px solid var(--line) }
.mm-sign > span:first-child { width: 132px; flex: none }
.mm-sign i { width: 14px; height: 14px; border-radius: 3px; flex: none; display: block; margin-top: 1px }

/* The email window */
.mm-ehead { display: flex; justify-content: flex-end; font-size: 11px }
.mm-esub { font-size: 15px; margin: 1px 0 5px }
.mm-ewho { display: flex; align-items: center; gap: 10px }
.mm-badge { width: 34px; height: 34px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 13px; flex: none }
.mm-ewho b { font-weight: 400; font-size: 14px; display: block }
.mm-ewho small { font-size: 11px; color: var(--win-muted) }
.mm-ebody { flex: 1; overflow: auto; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 4px; margin: 4px 0 }
.mm-ebar { display: flex; gap: 8px; align-items: center }

/* ---- What the buttons do ---- */
function removeMail(kind, id, from, path) {
  const m = find(id); if (!m) return false;
  if (kind === 'archive' && m.acct === 'Gmail' && !S.gmail.on) {
    if (from === 'triage') toast(GMAILNEED); else { S.err = GMAILNEED; renderStage(); }
    emit('gmail-needed'); return false;
  }
  S.gone.push(id); S.rctx = null; S.err = '';
  S.note = kind === 'archive' ? 'Archiving…' : kind === 'delete' ? 'Deleting…' : 'Filing…'; S.undo = null; renderStage();
  const text = kind === 'archive' ? `Archived “${m.subj}”` : kind === 'delete' ? `Deleted “${m.subj}”` : `Filed “${m.subj}” in ${path}`;
  later(() => { S.note = ''; const u = S.undo = { id, kind, text }; renderStage(); later(() => { if (S.undo === u) { S.undo = null; renderStage(); } }, 10000); }, 700);
  emit(kind, id); return true;
}
function undoLast() {
  const u = S.undo; if (!u) return;
  S.gone = S.gone.filter(x => x !== u.id); S.undo = null; S.note = 'Putting the email back…'; renderStage();
  later(() => { S.note = ''; renderStage(); }, 600);
  emit('undo');
}
function openEmail(id) { const m = find(id); m.read = true; set({ win: id, panel: false, rctx: null, force: null }); renderStage(); emit('win-open', id); }
function openRow(id) {
  if (S.openIn === 'apple') { set({ panel: false }); toast('Apple Mail opens at that email. (Nothing opens in this practice copy.)'); emit('open-apple'); }
  else if (S.openIn === 'spark') { set({ panel: false }); toast('Spark comes to the front. It cannot be told which email to show. (Practice copy: nothing opens.)'); emit('open-spark'); }
  else openEmail(id);
}
function reply() { toast('Mail’s reply window opens. (Practice copy: nothing opens.)'); emit('reply'); }
function triStart(unreadOnly) {
  const all = visible().sort((a, b) => b.ts - a.ts);
  S.tri = { ids: (unreadOnly ? all.filter(m => !m.read) : all).map(m => m.id), i: 0, done: [], unreadOnly };
}
function triNext() { const T = S.tri; if (T.i < T.ids.length) T.i++; renderStage(); }
function triAct(kind) {
  const T = S.tri; if (!T || S.sheet) return;
  const id = T.ids[T.i];
  if (kind === 'undo') { undoLast(); return; }
  if (kind === 'back') { if (T.i > 0) T.i--; renderStage(); emit('tri-back'); return; }
  if (kind === 'next') { triNext(); emit('tri-next'); return; }
  if (!id) return;
  const m = find(id);
  if (kind === 'read') { m.read = true; triNext(); emit('tri-read'); }
  else if (kind === 'reply') reply();
  else if (kind === 'file') { S.sheet = 'file'; S.folderQ = ''; renderStage(); emit('sheet', 'file'); }
  else if (kind === 'paragon') { S.sheet = 'paragon'; S.sheetTask = m.subj + ' – ' + m.from; S.sheetTags = ''; S.sheetPut = 'inbox'; renderStage(); emit('sheet', 'paragon'); }
  else if (kind === 'archive' || kind === 'delete') { removeMail(kind, id, 'triage'); T.done.push(id); triNext(); }
}
function pickFolder(path) {
  const T = S.tri, id = T.ids[T.i]; S.sheet = null; S.recent = [path, ...S.recent.filter(f => f !== path)];
  removeMail('file', id, 'triage', path); T.done.push(id); triNext(); emit('filed', path);
}

  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to click is out of sight (a window or the panel was closed), point at the way back to it.
  const el = q(curTarget) || (S.sheet ? q('sheet-cancel') : S.settings ? q('done') : S.tri ? q('tdots') : S.win ? q('edots') : S.panel ? q('gear') : q('item'));
  if (el) {
    el.classList.add('target');
    const pane = el.closest('.mm-pane');
    if (pane && pane !== el) { let top = 0, n = el; while (n && n !== pane) { top += n.offsetTop; n = n.offsetParent; } const bot = top + el.offsetHeight; if (top < pane.scrollTop || bot > pane.scrollTop + pane.clientHeight) pane.scrollTop = Math.max(0, top - 40); }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand">${tile(40)}<div><h1>Mail Menu Tour</h1><small>Learn the app in about 12 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '✓' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('trophy')}<span>On your Mac</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Everything here is a practice copy. Nothing changes on your Mac.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  const L = LESSONS[i]; if (L && L.setup) L.setup();   // bring the pretend Mac to where that chapter starts
  renderStep();
}

function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">· ${kindName} · step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('mailmenu-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ['Rest the pointer on the envelope in your menu bar and read the hint.',
    'Click the envelope. Open and close a sender by clicking its name.',
    'Click an email line and see it open in the small window. Press Escape to close it.',
    'Press the small blue "Triage" button, step through two emails with the Space key, then press Escape.',
    'Click the envelope with two fingers (or hold the control key and click) and look at the short menu.',
    'Open Settings with the gear at the bottom of the list. Look at the four tabs, then read "Signs in this app" at the end of "How it works".',
    'If you use Gmail: in the Gmail tab, press "Open Google\'s app password page", make an app password and press "Connect".'];
  let ticks = JSON.parse(store.get('mailmenu-real') || '[]');
  fin.innerHTML = `<h3>Now try it on your real Mac</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('mailmenu-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 960×560 pretend Mac into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 960})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'INPUT') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); } });
goChapter(0); fit();
</script>
